<form [formGroup]="dataForm" (ngSubmit)="onSubmit()">
  <div class="formgrid grid">
    <div class="field col-12 md:col-4">
      <app-input
        id="cardId"
        formControlName="cardId"
        placeholder="Ingrese el número de cédula a buscar"
        label="Número de cédula"
        inputmode="numeric"
        [control]="$any(dataForm).get('cardId')"
        (keydown)="preventNonNumeric($event)"
      />
    </div>
    <div class="field col-12 md:col-4">
      <app-input-date
        datePickerId="dateStart"
        formControlName="dateStart"
        placeholder="Selecciona una fecha"
        label="Fecha desde"
      />
    </div>
    <div class="field col-12 md:col-4">
      <app-input-date
        datePickerId="dateEnd"
        formControlName="dateEnd"
        placeholder="Selecciona una fecha"
        label="Fecha hasta"
        [min]="$any(dataForm).get('dateStart').value"
      />
    </div>
    <div class="flex justify-content-between flex-wrap mb-5">
      <div class="ml-2">
        <app-button label="Buscar" color="accent"/>
      </div>
      <div class="ml-5">
        <app-button label="Limpiar" color="secondary" type="reset" color="accent"/>
      </div>
    </div>
  </div>
</form>
