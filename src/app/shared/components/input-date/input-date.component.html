<mat-form-field appearance="fill" floatLabel="always" style="display: inline;">
  <mat-label>{{ label }}</mat-label>
  <input
    matInput
    [matDatepicker]="datePickerId"
    [placeholder]="placeholder"
    (dateInput)="setValue($event.value)"
    [min]="min"
    [value]="value"
  />
  <!-- <mat-hint>Mes/Día/Año</mat-hint> -->
  <mat-datepicker-toggle
    matIconSuffix
    [for]="datePickerId"
  ></mat-datepicker-toggle>
  <mat-datepicker #datePickerId></mat-datepicker>
</mat-form-field>
