<mat-form-field appearance="fill" floatLabel="always" class="custom-mat-form-field">
  <mat-label>{{ label }}</mat-label>
  <input matInput [id]="id" [required]="required" [inputMode]="inputmode" [placeholder]="placeholder" [value]="value"
    (input)="handleInput($event)" [formControl]="control" />
  <mat-error *ngIf="control.errors">
    {{ getErrorMessage() }}
  </mat-error>
  <mat-error *ngIf="control.invalid && control.touched"> </mat-error>
</mat-form-field>
